<meta charset="utf-8">
<title>AEGIS Brief Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: AEGIS design-system header with page nav; hash-routed levels (Home, Area, Brief, Trends, Archive) inside the 1200px container; item popout overlays any level. Single dark theme by design-system mandate. */
/* Dark is the design-system default. Text tokens are lifted where the canonical values fail WCAG 2.1 AA (muted 2.9:1 -> 5.0:1); --border-ctrl is a 3:1 border for form controls and focus rings, since card borders are decorative and exempt. */
:root {
  color-scheme: dark;
  --su-orange:#f76900; --su-blue:#000e54; --accent:#f76900; --on-accent:#111217; --accent-tint:rgba(247,105,0,.12);
  --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#1f2127; --bg-hover:#26282e; --bg-active:#2c2f35;
  --border:#2c2f35; --border-muted:#222529; --border-hover:#3d4148; --border-ctrl:#6b727d;
  --text-primary:#d9dce2; --text-secondary:#9299a4; --text-muted:#858b96; --text-dim:#3d4148;
  --ok:#3fb950; --degraded:#fade2a; --down:#f2495c; --pending:#9299a4; --external:#58a6ff; --maintenance:#9e6a03;
  --sev-critical:#f2495c; --sev-high:#ff780a; --sev-medium:#fade2a; --sev-low:#73bf69; --sev-unknown:#9299a4;
  --chart-t3:#9299a4; --overlay:rgba(17,18,23,.82); --shadow:0 8px 24px rgba(0,0,0,.45);
  --font-ui:'DM Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono','Fira Code',monospace;
  --radius-sm:3px; --radius-md:4px; --radius-lg:6px;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --accent:#000e54; --on-accent:#ffffff; --accent-tint:rgba(0,14,84,.08);
  --bg-canvas:#f4f5f7; --bg-primary:#ffffff; --bg-secondary:#eef0f3; --bg-hover:#e6e9ee; --bg-active:#dde1e8;
  --border:#d0d5dc; --border-muted:#e4e7ec; --border-hover:#aeb5bf; --border-ctrl:#767f8a;
  --text-primary:#1f2328; --text-secondary:#4f5862; --text-muted:#5f6873; --text-dim:#9aa1aa;
  --ok:#17742f; --degraded:#7d5a00; --down:#c42030; --pending:#5f6873; --external:#0b5fc2; --maintenance:#7d5a00;
  --sev-critical:#c42030; --sev-high:#a84600; --sev-medium:#7d5a00; --sev-low:#1f7a35; --sev-unknown:#5f6873;
  --chart-t3:#6b7480; --overlay:rgba(31,35,40,.6); --shadow:0 8px 24px rgba(31,35,40,.18);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --accent:#000e54; --on-accent:#ffffff; --accent-tint:rgba(0,14,84,.08);
  --bg-canvas:#f4f5f7; --bg-primary:#ffffff; --bg-secondary:#eef0f3; --bg-hover:#e6e9ee; --bg-active:#dde1e8;
  --border:#d0d5dc; --border-muted:#e4e7ec; --border-hover:#aeb5bf; --border-ctrl:#767f8a;
  --text-primary:#1f2328; --text-secondary:#4f5862; --text-muted:#5f6873; --text-dim:#9aa1aa;
  --ok:#17742f; --degraded:#7d5a00; --down:#c42030; --pending:#5f6873; --external:#0b5fc2; --maintenance:#7d5a00;
  --sev-critical:#c42030; --sev-high:#a84600; --sev-medium:#7d5a00; --sev-low:#1f7a35; --sev-unknown:#5f6873;
  --chart-t3:#6b7480; --overlay:rgba(31,35,40,.6); --shadow:0 8px 24px rgba(31,35,40,.18);
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:100;background:var(--bg-primary);color:var(--text-primary);border:2px solid var(--accent);border-radius:var(--radius-md);padding:.4rem .7rem;text-decoration:none}
.skip:focus{top:8px}
::placeholder{color:var(--text-muted);opacity:1}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-ui);font-size:14px;line-height:1.5}
body.locked{overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg-canvas)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:var(--external)}
.xf a,.src a,td a,.selbar a,.ph .sub a,.ev .t a,.pbody a,.panel .s a{text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chart .clk:focus-visible{outline:3px solid var(--accent)}
.mono{font-family:var(--font-mono)}.num{font-variant-numeric:tabular-nums}.muted{color:var(--text-muted)}.sec2{color:var(--text-secondary)}
h1,h2,h3{text-wrap:balance}

/* Header + nav */
.hdr{height:56px;background:var(--bg-primary);border-bottom:3px solid var(--su-orange);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:600;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.brand .pipe{color:var(--su-orange);margin:0 .4em}
.hdr-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0;position:relative}
.menubtn{display:none;font-size:18px;color:var(--text-secondary);padding:.2rem .4rem;border-radius:var(--radius-md)}
.menubtn:hover{color:var(--text-primary);background:var(--bg-hover)}
.search{position:relative}
.search input{font-family:var(--font-ui);background:var(--bg-canvas);border:1px solid var(--border-ctrl);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;padding:.35rem .6rem .35rem 1.7rem;width:240px;max-width:40vw}
.search input:focus{outline:none;border-color:var(--accent)}
.search:before{content:"⌕";position:absolute;left:.55rem;top:.25rem;color:var(--text-muted);font-size:15px;pointer-events:none}
.sres{position:absolute;top:calc(100% + 6px);right:0;width:420px;max-width:88vw;background:var(--bg-primary);border:1px solid var(--border-hover);border-radius:var(--radius-lg);box-shadow:var(--shadow);z-index:60;overflow:hidden}
.sres .r{display:flex;justify-content:space-between;gap:.6rem;padding:.5rem .75rem;border-bottom:1px solid var(--border-muted);cursor:pointer;font-size:13px;min-width:0}
.sres .r:last-child{border-bottom:0}.sres .r:hover{background:var(--bg-secondary)}
.sres .r .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .r .m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);white-space:nowrap}
.sres .none{padding:.6rem .75rem;color:var(--text-muted);font-size:12px}
.plus{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-hover);color:var(--text-primary);display:grid;place-items:center;font-size:18px;line-height:1;cursor:pointer;background:var(--bg-primary)}
.plus:hover{border-color:var(--accent);color:var(--accent)}
.fbov{position:fixed;inset:0;z-index:70;cursor:crosshair;background:var(--overlay);opacity:.45}
.fbhint{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:72;background:var(--bg-primary);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:.6rem .9rem;font-size:13px;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.fbhint b{display:block;font-size:14px}
.fbhint span{color:var(--text-secondary);font-size:12px}
.fbrect{position:fixed;border:2px dashed var(--accent);background:var(--accent-tint);z-index:71;pointer-events:none}
.fbpanel{position:fixed;inset:0;z-index:75;background:var(--overlay);overflow-y:auto;padding:4vh max(16px,env(safe-area-inset-right,0px)) 4vh max(16px,env(safe-area-inset-left,0px))}
.fbpanel .panel{max-width:760px}
.fbpanel img{max-width:100%;display:block;border:1px solid var(--border-hover);border-radius:var(--radius-md);background:var(--bg-canvas)}
.fbpanel label{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin:.8rem 0 .25rem}
.fbpanel textarea,.fbpanel input{font-family:var(--font-ui);width:100%;background:var(--bg-canvas);border:1px solid var(--border-ctrl);border-radius:var(--radius-md);color:var(--text-primary);font-size:14px;padding:.5rem .65rem}
.fbpanel textarea{min-height:76px;resize:vertical}
.fbpanel textarea:focus,.fbpanel input:focus{outline:none;border-color:var(--accent)}
.fbpanel .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.fbitem{display:grid;grid-template-columns:140px 1fr;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--border-muted);font-size:13px}
.fbitem img{max-width:140px}
.fbitem .m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.side{cursor:pointer}
.side a,.side button{cursor:pointer}
.pill.carried{color:var(--text-muted);border-style:dashed}
.item.carried{opacity:.78}
.item.carried:hover{opacity:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-active);border:1px solid var(--border-hover);color:var(--text-primary);font-family:var(--font-mono);font-size:12px;font-weight:600;display:grid;place-items:center;cursor:pointer}
.avatar:hover,.avatar[aria-expanded="true"]{border-color:var(--accent)}
.umenu{position:absolute;top:calc(100% + 8px);right:0;width:260px;background:var(--bg-primary);border:1px solid var(--border-hover);border-radius:var(--radius-lg);box-shadow:var(--shadow);z-index:60;overflow:hidden}
.umenu .who{padding:.7rem .9rem;border-bottom:1px solid var(--border)}
.umenu .who b{display:block;font-size:14px}
.umenu .who span{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.umenu a,.umenu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:.5rem .9rem;font-size:13px;color:var(--text-primary);text-decoration:none}
.umenu a:hover,.umenu button:hover{background:var(--bg-secondary)}
.umenu .sep{border-top:1px solid var(--border-muted)}
.umenu .dis{color:var(--text-muted);cursor:not-allowed}
.umenu .c{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px);transition:grid-template-columns .18s ease}
.side{background:var(--bg-primary);border-right:1px solid var(--border);padding:.9rem .7rem 1.5rem;position:sticky;top:0;height:calc(100vh - 56px);overflow-y:auto}
.side .tgl{margin:0}
.side .tgl button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0}
.side .tgl button:focus-visible{position:static;width:auto;height:auto;clip:auto;padding:.25rem .5rem;margin-bottom:.4rem;font-size:12px;color:var(--text-primary)}
.side .tgl button{color:var(--text-muted);padding:.25rem .4rem;border-radius:var(--radius-md);display:grid;place-items:center}
.side .tgl button:hover{color:var(--text-primary);background:var(--bg-hover)}
.side svg.i{width:16px;height:16px;flex-shrink:0;stroke:var(--text-primary);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .lnk .lb,.side .hd2 .lb{display:flex;align-items:center;gap:.55rem;min-width:0}
.side .lnk .lb span.tx,.side .hd2 .lb span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .lnk.top{color:var(--text-primary);font-weight:600}
.side .sub .lnk svg.i{width:13px;height:13px;stroke:var(--text-secondary)}
.shell.collapsed{grid-template-columns:56px minmax(0,1fr)}
.side.collapsed{padding:.9rem .5rem}
.side.collapsed .lnk,.side.collapsed .hd2{justify-content:center;padding:.5rem 0}
.side.collapsed .lnk .tx,.side.collapsed .hd2 .tx,.side.collapsed .dotc,.side.collapsed .chev,.side.collapsed .sub,.side.collapsed .ic{display:none}
.side.collapsed .lnk.on{box-shadow:inset 3px 0 0 var(--accent)}
.side .tgl button{color:var(--text-muted)}
.side.collapsed .grp .hd2.on{background:var(--bg-active);box-shadow:inset 3px 0 0 var(--accent)}
@media (max-width:900px){.shell.collapsed{grid-template-columns:1fr}.side.collapsed{padding:.9rem .7rem}.side.collapsed .lnk .tx,.side.collapsed .hd2 .tx,.side.collapsed .dotc,.side.collapsed .chev,.side.collapsed .sub{display:initial}.side.collapsed .lnk,.side.collapsed .hd2{justify-content:space-between;padding:.42rem .6rem}.side.collapsed .tgl{display:none}}
.side .lnk{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.42rem .6rem;border-radius:var(--radius-md);color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:500}
.side .lnk:hover{background:var(--bg-hover);color:var(--text-primary)}
.side .lnk.on{background:var(--bg-active);color:var(--text-primary);box-shadow:inset 3px 0 0 var(--accent)}
.side .grp{margin-top:.15rem}
.side .grp .hd2{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.42rem .6rem;border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:left}
.side .grp .hd2:hover{background:var(--bg-hover)}
.side .grp .hd2 .chev{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
/* v1.6.0: the group accordion animates its height (0fr -> 1fr on the grid track); the inner wrapper clips, and
   visibility keeps closed links out of the tab order the way display:none used to. The wrapper's 5px of room
   (padding pulled back by a negative margin, link margins top and bottom) keeps the 3px + 2px focus ring unclipped. */
.side .grp .sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease;padding-left:.5rem}
.side .grp.open .sub{grid-template-rows:1fr}
.side .grp .sub>.in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility .18s;padding:0 5px;margin:0 -5px}
.side .grp.open .sub>.in{visibility:visible}
.side .grp .sub>.in>.lnk:first-child{margin-top:5px}.side .grp .sub>.in>.lnk:last-child{margin-bottom:5px}
.side .sub .lnk{padding:.3rem .6rem .3rem .9rem;font-size:12.5px;font-weight:400}
.side .dotc{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.side .dotc.hot{color:var(--sev-critical)}
.side .ic{width:14px;display:inline-block;text-align:center;color:var(--text-muted);margin-right:.35rem;font-family:var(--font-mono);font-size:11px}
.content{min-width:0}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:56px;width:min(280px,86vw);z-index:40;transform:translateX(-105%);transition:transform .15s;box-shadow:var(--shadow)}.side.open{transform:none}.menubtn{display:inline-block}}
.pbody{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.9rem 1.1rem;margin-bottom:1rem}
.pbody h3{margin:0 0 .5rem;font-size:14px;font-weight:600}
.pbody .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin:.8rem 0 .25rem;padding-top:.6rem;border-top:1px solid var(--border-muted)}
.pbody .sub:first-of-type{margin-top:0;padding-top:0;border-top:0}
.pbody p{margin:0;max-width:80ch}
.pbody ol{margin:0;padding-left:1.2rem}
.pmeta{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.6rem 1rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:12px}
.pmeta .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin-right:.35rem}
.ribbon{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--external);border:1px dashed rgba(88,166,255,.5);padding:2px 7px;border-radius:var(--radius-sm);white-space:nowrap}
.btn{font-family:var(--font-ui);background:var(--bg-primary);border:1px solid var(--border-ctrl);border-radius:var(--radius-md);color:var(--text-primary);font-size:12px;padding:.3rem .7rem;transition:border-color .15s,color .15s,background-color .15s,transform .1s,filter .15s;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.sm{font-size:11px;padding:.15rem .5rem}

/* Page scaffolding */
.wrap{max-width:1200px;margin:0 auto;padding-block:1.1rem 2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.ph h1{margin:0;font-size:18px;font-weight:600}
.ph .sub{color:var(--text-secondary);font-size:13px}
.crumb{font-size:12px;color:var(--text-secondary);display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.crumb a{text-decoration:none}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.25rem;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:1.1rem;min-width:0}
/* v1.3.1: when the item column is shorter than the rail (few items, or a filter), fitTwo() adds .wrap and the
   rail's cards flow into a grid under the last item instead of running on as a narrow column. Section headers
   span the grid; tables keep full width. */
.two.wrap{grid-template-columns:minmax(0,1fr)}
.two.wrap .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem 1rem;align-items:start}
.two.wrap .rail .sec,.two.wrap .rail .stack{display:contents}
.two.wrap .rail .sec-h{grid-column:1/-1;margin:.5rem 0 0}
.two.wrap .rail .tw,.two.wrap .rail .empty{grid-column:1/-1}
.sec{margin-bottom:1.3rem;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border-left:3px solid var(--border-hover);padding-left:.6rem;margin-bottom:.5rem;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.3px}
.sec-h h2 .cnt{color:var(--text-muted);font-family:var(--font-mono);font-weight:400;font-size:12px;margin-left:.4rem}
.sec-h h2 .sub{color:var(--text-muted);font-weight:400;font-size:12px;margin-left:.5rem}
.sec-h .tools{display:flex;gap:.35rem;flex-wrap:wrap}
.sec-h .tools button,.sec-h .tools a{font-size:11px;color:var(--text-secondary);padding:.15rem .45rem;border:1px solid var(--border);border-radius:var(--radius-sm);text-decoration:none}
.sec-h .tools button:hover,.sec-h .tools a:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--text-muted);font-size:13px;padding:.5rem .75rem;border:1px dashed var(--border);border-radius:var(--radius-md)}
.stack{display:flex;flex-direction:column;gap:.55rem}
.band{display:flex;align-items:center;gap:.6rem;margin:.6rem 0 .2rem;font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted)}
.band:after{content:"";flex:1;border-top:1px dashed var(--border-hover)}
.band.t1{color:var(--sev-critical)}
.banner-err{background:rgba(242,73,92,.10);border:1px solid rgba(242,73,92,.40);border-radius:var(--radius-md);color:var(--down);font-size:12px;padding:.5rem .75rem;margin-bottom:1rem}

/* Counts strip */
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.55rem;margin-bottom:1.1rem}
.tile{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.55rem .8rem;min-width:0}
.tile .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted)}
.tile .v{font-size:21px;font-weight:600;line-height:1.2;margin-top:.05rem;display:flex;align-items:baseline;gap:.5rem}
.tile .d{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
.tile .d.up{color:var(--down)}.tile .d.down{color:var(--ok)}
.tile.t1 .v{color:var(--sev-critical)}
.tile.esc .v{color:var(--sev-high)}

/* Area cards (Jira recent-projects pattern) */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.25rem}
.acard{display:grid;grid-template-columns:8px 1fr;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0;text-decoration:none;color:inherit}
.acard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 14px var(--accent-tint)}
.acard .rail-c{background:var(--border-hover)}
.acard.hot{background:rgba(242,73,92,.06);border-color:rgba(242,73,92,.35)}

.picker{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem .75rem;border:1px dashed var(--border-hover);border-radius:var(--radius-md);align-items:center}
.picker .chk{display:inline-flex;align-items:center;gap:.3rem;font-size:12px;padding:.2rem .55rem;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary)}

/* Filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.7rem}

select.sel{font:inherit;font-size:12px;background:var(--bg-canvas);border:1px solid var(--border-ctrl);border-radius:var(--radius-md);color:var(--text-primary);padding:.25rem .4rem}

/* Badges (design system) */

.tlp{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:var(--radius-sm);border:1px solid;white-space:nowrap;display:inline-block}
.tlp-red{color:var(--down);background:rgba(242,73,92,.12);border-color:rgba(242,73,92,.35)}
.tlp-amber,.tlp-amber_strict{color:var(--degraded);background:rgba(250,222,42,.10);border-color:rgba(250,222,42,.3)}

.achip{font-family:var(--font-mono);font-size:10px;padding:1px 6px;border-radius:var(--radius-sm);background:var(--bg-hover);border:1px solid var(--border);color:var(--text-secondary);display:inline-block;margin:1px 2px 1px 0;text-decoration:none}

/* Score circle */
.circ{--p:0;width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:conic-gradient(from 0deg,var(--text-primary) calc(var(--p)*1%),var(--border-muted) 0);position:relative}

/* Expanded card */

.xf{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.7rem;padding-top:.55rem;border-top:1px solid var(--border-muted);font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}

.xf a{text-decoration:none}.xf .sp{flex:1}.xf .hint{color:var(--text-dim);font-size:10px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}

/* Cards + context */
.card{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.85rem 1rem;min-width:0}

.card .one{display:flex;gap:.5rem;align-items:baseline;cursor:pointer;min-width:0}

.card.absent{border-style:dashed}.card.absent h3{color:var(--text-muted)}

/* Activity stream */
.stream{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.5rem .9rem}

/* Charts */
.chart{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.7rem .9rem .5rem;min-width:0}

.chart .sel text{stroke:none}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:.35rem}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.3rem;vertical-align:middle;border:1px solid var(--border-ctrl)}
.c-t1{fill:var(--sev-critical)}.c-t2{fill:var(--sev-medium)}.c-t3{fill:var(--chart-t3)}
.c-new{fill:var(--external)}.c-drop{fill:var(--text-secondary)}
.c-line{fill:none;stroke:var(--text-primary);stroke-width:2}
.c-line2{fill:none;stroke:var(--external);stroke-width:2}
.c-bar{fill:var(--text-secondary)}.c-bar2{fill:var(--sev-critical)}
.c-mark{fill:var(--accent)}
.i-t1{background:var(--sev-critical)}.i-t2{background:var(--sev-medium)}.i-t3{background:var(--chart-t3)}.i-new{background:var(--external)}.i-drop{background:var(--text-secondary)}.i-line{background:var(--text-primary)}.i-mark{background:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.9rem;margin-bottom:1.1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden}
.kpi{padding:.8rem 1rem;border-right:1px solid var(--border-muted);border-bottom:1px solid var(--border-muted);min-width:0}

.kpi .v{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.kpi .n{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-family:var(--font-mono);font-size:12px;font-weight:500}
.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--down)}.kpi .d.bad-up{color:var(--down)}.kpi .d.good-down{color:var(--ok)}.kpi .d.flat{color:var(--text-muted)}
.kpi .s{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:.15rem}
.chart{position:relative}
.chart .ctip{position:absolute;z-index:6;pointer-events:none;background:var(--bg-secondary);border:1px solid var(--border-hover);border-radius:var(--radius-md);padding:.4rem .6rem;font-size:12px;box-shadow:var(--shadow);display:none;min-width:140px;max-width:260px}

.chart .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.chart .clk.sel rect.bar,.chart .clk.sel circle{stroke:var(--accent);stroke-width:2}
.legend i{border-radius:50%;width:10px;height:10px;border:0}
.c-a{fill:var(--external);stroke:var(--external)}.c-b{fill:var(--chart-t3);stroke:var(--chart-t3)}.c-c{fill:var(--sev-high);stroke:var(--sev-high)}
.i-a{background:var(--external)}.i-b{background:var(--chart-t3)}.i-c{background:var(--sev-high)}
.chart .hb text.val{fill:var(--text-primary);font-weight:500}
.cmp{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.rcat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.rcard{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem .9rem;cursor:pointer;transition:border-color .15s,transform .15s;text-decoration:none;color:inherit;display:block;min-width:0}

function hbars(rows,sel,o={}){ /* rows: [{key,label,value,sub,subLabel,note}] */

function calendarStrip(days,vals,marks,sel){const n=days.length,cw=(CW-PL-PR)/n;const mx=Math.max(1,...vals);let s=`<svg viewBox="0 0 ${CW} 70" role="img" aria-label="Calendar strip">`;

async function signInWithPassword(){
  const inp=document.getElementById('signinEmail'),pw=document.getElementById('signinPw'),st=document.getElementById('signinStatus'),btn=document.getElementById('signinSubmit');
  const email=String(inp&&inp.value||'').trim(),password=String(pw&&pw.value||'');lastEmail=email;
  const say=(msg,cls)=>{if(st){st.textContent=msg;st.className='st '+(cls||'')}announce(msg)};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){if(inp){inp.setAttribute('aria-invalid','true');inp.focus()}say('Enter a valid email address.','err');return}
  if(!password){if(pw){pw.setAttribute('aria-invalid','true');pw.focus()}say('Enter your password, or request a one-time code below.','err');return}
  if(!SB){say('Sign-in is not configured for this page.','err');return}
  setBusy(btn,true);say('Signing in…');
  try{
    const {error}=await SB.auth.signInWithPassword({email,password});
    if(error)throw error;AUTH_ERR='';say('Signed in. Loading…','ok');   /* onAuthChange boots the page */
  }catch(e){const msg=String(e&&e.message||e);
    say(/invalid login credentials/i.test(msg)?'Email or password did not match. If you have not set a password yet, request a one-time code below.':/email not confirmed/i.test(msg)?'This account has not been verified yet. Request a one-time code below to verify it.':/rate limit|too many/i.test(msg)?'Too many attempts; wait a minute and try again.':'Could not sign in: '+msg,'err');
    if(pw){pw.value='';pw.focus()}
    setBusy(btn,false)}
}
/* Set or change password. force=true blocks the app until a password is saved (first sign-in via code, or an
   admin-created account whose placeholder password must never be used). */
function showSetPassword(force){
  PW_FORCE=!!force;const m=document.getElementById('main');if(!m)return;
  document.getElementById('ov').innerHTML='';document.body.classList.remove('locked');document.getElementById('side').innerHTML='';
  m.innerHTML=`<div class="panel signin"><h1>${force?'Set your password':'Change your password'}</h1><p class="lead">${force?'You are verified. Choose a password for next time; you can always fall back to an emailed code.':'Choose a new password for '+esc(userEmail()||'this account')+'.'} At least 12 characters.</p>
    <form id="pwForm" novalidate><label for="pw1">New password</label><input id="pw1" name="new-password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="pwStatus">
    <label for="pw2">Repeat it</label><input id="pw2" name="new-password-repeat" type="password" autocomplete="new-password" minlength="12" required aria-describedby="pwStatus">
    <div class="row"><button class="btn primary" type="submit" id="pwSubmit">Save password</button>${force?'<button class="btn" type="button" id="pwSignOut">Sign out</button>':'<button class="btn" type="button" data-pw-cancel>Cancel</button>'}</div>
    <p id="pwStatus" class="st"></p></form></div>`;
  document.title=(force?'Set your password':'Change password')+' · AEGIS Daily Brief';renderRibbon();
  const f=document.getElementById('pw1');if(f)f.focus();
  announce(force?'Set a password to continue.':'Change your password.');
}
async function savePassword(){
  const a=document.getElementById('pw1'),b=document.getElementById('pw2'),st=document.getElementById('pwStatus'),btn=document.getElementById('pwSubmit');
  const p1=String(a&&a.value||''),p2=String(b&&b.value||'');
  const say=(msg,cls)=>{if(st){st.textContent=msg;st.className='st '+(cls||'')}announce(msg)};
  if(p1.length<12){if(a){a.setAttribute('aria-invalid','true');a.focus()}say('Use at least 12 characters.','err');return}
  if(p1!==p2){if(b){b.setAttribute('aria-invalid','true');b.focus()}say('The two entries do not match.','err');return}
  if(!SB||!userId()){showSignIn();return}
  setBusy(btn,true);say('Saving…');
  try{
    const {error}=await SB.auth.updateUser({password:p1});
    if(error)throw error;
    const r=await SB.from('user_settings').upsert({user_id:userId(),pw_set:true},{onConflict:'user_id'});
    if(r&&r.error)throw r.error;
    PW_SET=true;PW_FORCE=false;announce('Password saved.');
    try{if(/^#item-/.test(location.hash||''))history.replaceState(history.state,'',location.pathname+location.search+pageHash())}catch(e){}
    if(BOOTED){renderSide();render()}else boot();
  }catch(e){const msg=String(e&&e.message||e);
    say(/weak|pwned|leaked|compromised|easy to guess/i.test(msg)?'That password has appeared in a known breach or is too easy to guess; choose another.':/same password/i.test(msg)?'That is already your password; choose a new one.':'Could not save the password: '+msg,'err');
    setBusy(btn,false)}
}
/* Step 2 of sign-in: the code field. Codes rather than links because mail-security scanners (Defender Safe Links on
   the syr.edu tenant) fetch every URL in an email before delivery, which redeems a one-time link before the reader
   sees it. A code is inert until typed. */
function showCodeStep(email){
  const m=document.getElementById('main');if(!m)return;
  m.innerHTML=`<div class="panel signin"><h1>Enter your sign-in code</h1><p class="lead">We sent a one-time code to <b>${esc(email)}</b>. It expires in an hour; a new request replaces it.</p>
    <form id="codeForm" novalidate><label for="signinCode">Code from the email</label><input id="signinCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="12" required aria-describedby="signinStatus" class="mono" style="letter-spacing:.25em;font-size:18px">
    <div class="row"><button class="btn primary" type="submit" id="codeSubmit">Verify code</button><button class="btn" type="button" data-signin-back>Use a different email</button><button class="btn" type="button" data-signin-resend>Send a new code</button></div>
    <p id="signinStatus" class="st ok">Check ${esc(email)} for the code. The message is from the AEGIS sender; look in junk if it is slow to arrive.</p></form></div>`;
  const f=document.getElementById('signinCode');if(f)f.focus();
}
async function sendMagicLink(){
  const inp=document.getElementById('signinEmail'),st=document.getElementById('signinStatus'),btn=document.getElementById('signinSubmit');
  const email=String(inp&&inp.value||'').trim();lastEmail=email;
  const say=(msg,cls)=>{if(st){st.textContent=msg;st.className='st '+(cls||'')}announce(msg)};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){if(inp){inp.setAttribute('aria-invalid','true');inp.focus()}say('Enter a valid email address.','err');return}
  if(inp)inp.removeAttribute('aria-invalid');
  if(!SB){say('Sign-in is not configured for this page.','err');return}
  setBusy(btn,true);say('Sending the code…');
  try{
    const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:truthy(CFG&&CFG.allowSignup)}});
    if(error)throw error;AUTH_ERR='';
    showCodeStep(email);announce(`Code sent to ${email}. Enter the code from the email.`);
  }catch(e){const msg=String(e&&e.message||e);
    say(/signups? not allowed|user not found|not allowed for otp/i.test(msg)?'That email is not on the access list. Ask an AEGIS admin to invite you.':/rate limit|too many|security purposes/i.test(msg)?'Too many requests for this address; wait a minute and try again.':'Could not send the code: '+msg,'err');
    setBusy(btn,false)}
}
async function verifyCode(){
  const inp=document.getElementById('signinCode'),st=document.getElementById('signinStatus'),btn=document.getElementById('codeSubmit');
  const code=String(inp&&inp.value||'').replace(/\D/g,'');
  const say=(msg,cls)=>{if(st){st.textContent=msg;st.className='st '+(cls||'')}announce(msg)};
  if(code.length<6||code.length>10){if(inp){inp.setAttribute('aria-invalid','true');inp.focus()}say('Enter the numeric code from the email (6 to 10 digits).','err');return}
  if(inp)inp.removeAttribute('aria-invalid');
  if(!SB||!lastEmail){showSignIn('code');return}
  setBusy(btn,true);say('Checking the code…');
  try{
    const {error}=await SB.auth.verifyOtp({email:lastEmail,token:code,type:'email'});
    if(error)throw error;AUTH_ERR='';say('Signed in. Loading…','ok');   /* onAuthChange boots the page */
  }catch(e){const msg=String(e&&e.message||e);
    say(/expired|invalid/i.test(msg)?'That code is not valid any more. Send a new code and use the latest email.':'Could not verify the code: '+msg,'err');
    if(inp){inp.setAttribute('aria-invalid','true');if(inp.select)inp.select();inp.focus()}
    setBusy(btn,false)}
}
async function signOut(){
  state.umenu=false;renderUmenu();
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;try{await pushSettings()}catch(e){}}
  try{if(SB)await SB.auth.signOut({scope:'local'})}catch(e){}
  SESSION=null;setAuthCookie(null);setStoreNs(null);PW_SET=true;PW_FORCE=false;renderAvatar();announce('Signed out');
  if(needAuth()){BOOTED=false;document.getElementById('side').innerHTML='';showSignIn();renderUmenu()}
  else render();
}

/* ---- user_settings sync: localStorage stays the fallback and a write-through cache ---- */
async function pullSettings(){
  const uid=userId();if(!SB||!uid)return;
  setStoreNs(uid);   /* this user's cache, empty on a browser they have not used */
  try{
    const q=SB.from('user_settings').select('my_areas,stars,viewed,theme,pw_set').eq('user_id',uid).maybeSingle();
    const r=await Promise.race([q,new Promise(res=>setTimeout(()=>res({timeout:true}),4000))]);
    if(!r||r.timeout||r.error)return;
    if(!r.data){PW_SET=false;scheduleSettingsSync();return}   /* first sign-in: seed the row from this user's (empty) cache */
    PW_SET=r.data.pw_set===true;
    const arr=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):null;
    applyingRemote=true;
    try{
      const m=arr(r.data.my_areas),s=arr(r.data.stars),v=arr(r.data.viewed);
      if(m){myAreas=new Set(m);store.set('my',[...myAreas])}
      if(s){stars=new Set(s);store.set('stars',[...stars])}
      if(v){viewed=v.slice(0,12);store.set('viewed',viewed)}
      const th=r.data.theme;if(th==='dark'||th==='light'||th==='system'){try{if(th==='system')localStorage.removeItem('aegis4-theme');else localStorage.setItem('aegis4-theme',th)}catch(e){}if(th==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th)}
    }finally{applyingRemote=false}
  }catch(e){}
}
function scheduleSettingsSync(){if(applyingRemote||!SB||!userId())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;pushSettings()},300)}
function pushSettings(){
  const uid=userId();if(!SB||!uid)return Promise.resolve();
  const row={user_id:uid,my_areas:[...myAreas],stars:[...stars],viewed:viewed.slice(0,12),theme:curTheme(),updated_at:new Date().toISOString()};
  return Promise.resolve().then(()=>SB.from('user_settings').upsert(row,{onConflict:'user_id'}))
    .then(r=>{if(r&&r.error&&typeof console!=='undefined')console.warn('AEGIS settings sync failed:',r.error.message)})
    .catch(e=>{if(typeof console!=='undefined')console.warn('AEGIS settings sync failed:',e)});
}

/* ---- feedback: team store (table feedback + bucket feedback-screenshots) on top of the local list ---- */
/* v1.6.0: a success toast fades out (leaving phase, 200 ms) before it is removed. Each toast carries a token so the
   two timers only act on the toast they were set for; the leaving state is a new object, not a mutation. */
let toastSeq=0;
function setToast(msg,cls){const token=++toastSeq;fb.toast={msg,cls,token};if(!fb.mode)fbRender();announce(msg);if(cls==='ok'){setTimeout(()=>{if(!fb.toast||fb.toast.token!==token)return;fb.toast={...fb.toast,leaving:true};if(!fb.mode)fbRender();setTimeout(()=>{if(fb.toast&&fb.toast.token===token){fb.toast=null;if(!fb.mode)fbRender()}},200)},6000)}}
function dataUrlToBlob(u){const i=u.indexOf(',');const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:'image/jpeg'})}
async function fbRemote(entry){
  const uid=userId();if(!SB||!uid)return;
  let path=null,note='';
  try{
    if(entry.shot){try{const p=`${uid}/${Date.now()}.jpg`;const up=await SB.storage.from('feedback-screenshots').upload(p,dataUrlToBlob(entry.shot),{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;path=p}catch(e){note=` (screenshot upload failed: ${e&&e.message||e})`}}
    const r=await SB.from('feedback').insert({user_id:uid,page:entry.page,bug:entry.bug,change:entry.change,screenshot_path:path});
    if(r.error)throw r.error;
    entry.remote='saved';entry.screenshot_path=path;store.set('feedback',fb.list);
    setToast('Saved to the team store'+note,note?'err':'ok');
  }catch(e){entry.remote='error';store.set('feedback',fb.list);setToast(`Not saved to the team store: ${e&&e.message||e}. It is still saved in this browser.`,'err')}
  if(fb.mode==='list')fbRender();
}
boot();
</script>
