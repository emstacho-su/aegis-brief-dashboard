[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-worker"
version = "1.0.0"
description = "AEGIS daily brief worker: validate, index, render, store and serve daily briefs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "pydantic>=2",
  "jsonschema>=4.18",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aegis-worker = "aegis_worker.cli:main"

[tool.setuptools]
packages = ["aegis_worker"]

[tool.setuptools.package-data]
# _shared/ holds build-time copies of packages/brief.schema.json and packages/areas.json
# (the Dockerfile copies them in; `python -m aegis_worker.shared --sync` does it locally).
aegis_worker = ["_shared/*.json", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"aegis_worker/cli.py" = ["T20"]
"tests/*" = ["T20"]
